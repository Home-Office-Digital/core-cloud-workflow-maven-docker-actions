version: 2
updates:
    # Enable Github Action updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(GHA)"
      labels:
          - "dependencies"
          - "patch"
          - "actions"
      groups:
          # One group for everything, majors included, since an action
          # major is usually just a runtime bump
          github-actions-all:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
                  - "major"

    # Enable docker dependencies updates for Dockerfiles
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(Docker)"
      labels:
          - "dependencies"
          - "patch"
          - "docker"
      groups:
          docker-security:
              applies-to: security-updates
              patterns:
                  - "*"
          docker-minor-and-patch:
              applies-to: version-updates
              update-types:
                  - "minor"
                  - "patch"

    # Enable maven dependencies updates for Maven Projects
    - package-ecosystem: "maven"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(Java)"
      labels:
          - "dependencies"
          - "patch"
          - "java"
      groups:
          maven-security:
              applies-to: security-updates
              patterns:
                  - "*"
          maven-minor-and-patch:
              applies-to: version-updates
              update-types:
                  - "minor"
                  - "patch"
     
    # Enable version updates for Gradle Projects
    - package-ecosystem: "gradle"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(Java)"
      labels:
          - "dependencies"
          - "patch"
          - "java"
      groups:
          gradle-security:
              applies-to: security-updates
              patterns:
                  - "*"
          gradle-minor-and-patch:
              applies-to: version-updates
              update-types:
                  - "minor"
                  - "patch"

    # Enable PIP updates for Python Projects
    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(Python)"
      labels:
          - "dependencies"
          - "patch"
          - "python"
      groups:
          # Grouped by update-type, not dependency-type: Dependabot treats
          # everything in pyproject.toml as a production dependency
          python-security:
              applies-to: security-updates
              patterns:
                  - "*"
          python-minor-and-patch:
              applies-to: version-updates
              update-types:
                  - "minor"
                  - "patch"